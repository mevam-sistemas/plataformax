name: Backup independente

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-modox
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes age expect postgresql-client-17 zstd
      - name: Validar configuração protegida
        run: |
          set -euo pipefail
          for variable in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_PASSPHRASE; do
            [[ -n "${!variable:-}" ]] || { echo "Segredo obrigatório ausente: $variable" >&2; exit 1; }
          done
      - name: Exportar banco e arquivos
        run: |
          set -euo pipefail
          backup_dir="${RUNNER_TEMP}/modox-backup"
          mkdir -p "$backup_dir/database" "$backup_dir/storage"
          /usr/lib/postgresql/17/bin/pg_dump --dbname="$SUPABASE_DB_URL" --format=custom --compress=9 --no-owner --no-privileges \
            --schema=auth --schema=storage --schema=public --file="$backup_dir/database/modox.dump"
          STORAGE_BACKUP_DIR="$backup_dir/storage" python3 scripts/backup/export_storage.py
          /usr/lib/postgresql/17/bin/pg_restore --list "$backup_dir/database/modox.dump" > "$backup_dir/database/contents.list"
          printf '%s\n' "$(date -u +%FT%TZ)" > "$backup_dir/created-at-utc.txt"
          printf '%s\n' "$GITHUB_SHA" > "$backup_dir/source-commit.txt"
          (cd "$backup_dir" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Compactar e criptografar
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/modox-$(date -u +%F).tar.zst"
          tar --directory="${RUNNER_TEMP}" --create --file=- modox-backup | zstd -19 -T0 > "$archive"
          export INPUT_ARCHIVE="$archive" OUTPUT_ARCHIVE="${archive}.age"
          expect <<'EXPECT_EOF'
          set timeout -1
          log_user 0
          spawn age --passphrase --output $env(OUTPUT_ARCHIVE) $env(INPUT_ARCHIVE)
          expect "Enter passphrase"
          send -- "$env(BACKUP_PASSPHRASE)\r"
          expect "Confirm passphrase"
          send -- "$env(BACKUP_PASSPHRASE)\r"
          expect eof
          catch wait result
          exit [lindex $result 3]
          EXPECT_EOF
          shred --remove "$archive"
          echo "BACKUP_FILE=${archive}.age" >> "$GITHUB_ENV"
      - name: Guardar backup cifrado
        uses: actions/upload-artifact@v4
        with:
          name: modox-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
          if-no-files-found: error
