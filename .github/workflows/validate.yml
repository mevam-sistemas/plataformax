name: Validar aplicação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código versionado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar arquivos e referências do PWA
        shell: bash
        run: |
          set -euo pipefail
          node --check app/sw.js
          node --check app/version.js
          awk 'BEGIN{inside=0} /^<script>$/{inside=1;next} /^<\/script>$/{if(inside){exit}} inside{print}' app/index.html | node --check
          node -e "JSON.parse(require('fs').readFileSync('app/manifest.webmanifest', 'utf8'))"
          test -f img/icon-192.png
          test -f img/icon-512.png
          grep -Fq '<link rel="manifest" href="/app/manifest.webmanifest">' app/index.html
          grep -Fq "navigator.serviceWorker.register('/app/sw.js'" app/index.html
          grep -Fq "self.MODOX_VERSION = '" app/version.js
          grep -Fq "const VERSION = 'modox-' + self.MODOX_VERSION" app/sw.js
          node scripts/test-validadores.mjs

      - name: Impedir conflitos e segredos conhecidos
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Marcador de conflito encontrado.' >&2
            exit 1
          fi
          if grep -RInE '(SUPABASE_SERVICE_ROLE_KEY|R2_SECRET_ACCESS_KEY|BACKUP_PASSPHRASE)[[:space:]]*=[[:space:]]*[^${[:space:]]' \
            --exclude-dir=.git .; then
            echo 'Possível segredo administrativo versionado.' >&2
            exit 1
          fi

      - name: Validar integridade do diff
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD -- . \
              ':(exclude)app/supabase.min.js' ':(exclude)app/qrcode.min.js'
          else
            git show --check --format= HEAD -- . \
              ':(exclude)app/supabase.min.js' ':(exclude)app/qrcode.min.js'
          fi

      - name: Validar convenções das migrações
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d supabase/migrations ]]; then
            find supabase/migrations -type f ! -name '[0-9]*_*.sql' -print -quit | grep -q . && {
              echo 'Migração fora do padrão DATA_descricao.sql.' >&2
              exit 1
            }
            if grep -RInE 'service_role[^;]*(=|:)[[:space:]]*[A-Za-z0-9._-]{20,}' supabase/migrations; then
              echo 'Possível segredo em migração.' >&2
              exit 1
            fi
          fi
