name: Validar aplicação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código versionado
        uses: actions/checkout@v4

      - name: Validar arquivos e referências do PWA
        shell: bash
        run: |
          set -euo pipefail
          node --check app/sw.js
          node -e "JSON.parse(require('fs').readFileSync('app/manifest.webmanifest', 'utf8'))"
          test -f img/icon-192.png
          test -f img/icon-512.png
          grep -Fq '<link rel="manifest" href="/app/manifest.webmanifest">' app/index.html
          grep -Fq "navigator.serviceWorker.register('/app/sw.js'" app/index.html
          grep -Fq "const VERSION = 'modox-" app/sw.js

      - name: Impedir conflitos e segredos conhecidos
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Marcador de conflito encontrado.' >&2
            exit 1
          fi
          if grep -RInE '(SUPABASE_SERVICE_ROLE_KEY|R2_SECRET_ACCESS_KEY|BACKUP_PASSPHRASE)[[:space:]]*=[[:space:]]*[^${[:space:]]' \
            --exclude-dir=.git .; then
            echo 'Possível segredo administrativo versionado.' >&2
            exit 1
          fi

      - name: Validar integridade do diff
        run: git diff --check HEAD~1 HEAD
